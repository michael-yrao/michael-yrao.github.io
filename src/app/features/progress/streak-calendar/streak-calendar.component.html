<div class="streak-cal">
  <div class="streak-cal__months" aria-hidden="true">
    @for (col of monthColumns(); track $index) {
      <span class="streak-cal__month">{{ col.label }}</span>
    }
  </div>
  <div class="streak-cal__grid" role="img" [attr.aria-label]="'Study-day heatmap, last ' + windowWeeks + ' weeks, since ' + since()">
    @for (cell of cells(); track cell.date) {
      <span
        class="streak-cal__cell"
        [class.streak-cal__cell--filled]="cell.studied"
        [class.streak-cal__cell--today]="cell.date === today"
        [attr.title]="cell.date + (cell.studied ? ' · studied' : '')"
      ></span>
    }
  </div>
  <p class="streak-cal__legend">
    last {{ windowWeeks }} weeks · since {{ since() }} · {{ studyDays().length }} study days total ·
    current streak {{ current() }} · longest {{ longest() }}
  </p>
</div>
