<div class="code-viewer">
  <div class="code-viewer__header">
    <span class="code-viewer__lang">python</span>
  </div>
  <pre class="code-viewer__pre"><code #codeEl class="hljs language-python">@for (line of lines; track $index) {
    <div
      class="code-line"
      [class.code-line--gap]="line.isGap"
      [class.code-line--active]="isActive($index)"
      [class.code-line--range-start]="isRangeStart($index)"
      [class.code-line--range-end]="isRangeEnd($index)"
      ><span class="code-line__num">{{ line.sourceLine }}</span><span class="code-line__content" [innerHTML]="line.html"></span></div>
    }</code></pre>
  </div>
