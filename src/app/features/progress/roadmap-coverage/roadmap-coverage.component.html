<div class="roadmap__head">
  <h3 class="roadmap__title">Roadmap coverage</h3>
</div>
<div class="roadmap__levels">
  @for (r of rows(); track r.key) {
    <div
      class="roadmap__level"
      role="group"
      [attr.aria-label]="r.label + ': ' + r.started + ' of ' + r.total + ' started'"
    >
      <div class="roadmap__level-head">
        <span class="roadmap__label">{{ r.label }}</span>
        <span class="roadmap__count">{{ r.started }} of {{ r.total }}</span>
      </div>
      <div class="roadmap__tiles">
        @for (t of r.tiles; track t.name) {
          <button
            type="button"
            class="roadmap__tile"
            [class.roadmap__tile--started]="t.started"
            [attr.title]="t.name"
            [attr.aria-label]="t.name + ', ' + (t.started ? 'started' : 'not started')"
            (click)="select.emit(t.name)"
          ></button>
        }
      </div>
    </div>
  }
</div>
