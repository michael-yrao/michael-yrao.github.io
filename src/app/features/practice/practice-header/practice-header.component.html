<header class="practice-header">
  <div class="practice-header__title-row">
    @if (isTitleShown()) {
      <h1 class="practice-header__heading" [attr.title]="title()">
        <span class="practice-header__num">#{{ number() }}</span>
        <a class="practice-header__title-link" [routerLink]="['/practice', number()]" queryParamsHandling="preserve">{{ title() }}</a>
        @if (titleUrl(); as url) {
          <a class="practice-header__arrow" [href]="url" target="_blank" rel="noopener" aria-label="External" title="External"><app-icon name="external" [size]="14" /></a>
        }
      </h1>
      @if (difficulty(); as level) {
        <span class="difficulty-badge" [ngClass]="'badge-' + level.toLowerCase()">{{ level }}</span>
      }
    }
    @if (pane(); as pane) {
      @if (pane.hasCode) {
        <nav class="practice-header__tabs" aria-label="Problem views">
          <button
            type="button"
            class="practice-header__tab"
            [class.practice-header__tab--active]="pane.shown === 'description'"
            [attr.aria-pressed]="pane.shown === 'description'"
            (click)="paneSelect.emit('description')"
          >
            Description
          </button>
          <button
            type="button"
            class="practice-header__tab"
            [class.practice-header__tab--active]="pane.shown === 'code'"
            [attr.aria-pressed]="pane.shown === 'code'"
            (click)="paneSelect.emit('code')"
          >
            Code
          </button>
        </nav>
      }
    }
  </div>
  <div class="practice-header__neighbor-nav">
    <app-today-strip [number]="number()" [isCelebrating]="isPassFresh()" />
  </div>
</header>
