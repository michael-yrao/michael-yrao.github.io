<span class="search-box__glyph" aria-hidden="true"><app-icon name="search" [size]="14" /></span>
<input
  #input
  type="search"
  class="search-box__input"
  autocomplete="off"
  [attr.aria-label]="ariaLabel()"
  [placeholder]="placeholder()"
  [value]="value()"
  (input)="value.set($any($event.target).value)"
  (keydown.enter)="submitted.emit()"
  [attr.aria-activedescendant]="activeDescendant()"
  (keydown.arrowdown)="arrowDown.emit(); $event.preventDefault()"
  (keydown.arrowup)="arrowUp.emit(); $event.preventDefault()"
  (keydown.escape)="onEscape($event)"
/>
