<span class="row-menu">
  @if (mark(); as text) {
    <span class="row-menu__mark">{{ text }}</span>
  }
  <app-menu [label]="'More for ' + title()" size="sm" align="end">
    @if (isPickerOpen()) {
      <div class="menu__row row-menu__picker">
        <input
          #dateInput
          type="date"
          class="row-menu__date"
          aria-label="Hold until…"
          [min]="minDate()"
          [max]="maxDate()"
          [disabled]="isBusy()"
          (change)="onDateChange($event)"
        />
        <button type="button" role="menuitem" class="menu__item row-menu__cancel" data-keeps-open (click)="togglePicker()">
          Cancel
        </button>
      </div>
    } @else {
      <button
        type="button"
        role="menuitem"
        class="menu__item"
        data-keeps-open
        [disabled]="isBusy()"
        (click)="togglePicker()"
      >
        Hold until…
      </button>
      @if (mark()) {
        <button
          type="button"
          role="menuitem"
          class="menu__item"
          data-keeps-open
          [disabled]="isBusy()"
          (click)="release()"
        >
          Release
        </button>
      }
    }
    @if (refusal(); as message) {
      <div class="menu__row row-menu__refusal">{{ message }}</div>
    }
  </app-menu>
</span>
