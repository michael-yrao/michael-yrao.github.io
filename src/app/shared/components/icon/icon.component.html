<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.data-name]="name()"
  [attr.role]="isDecorative() ? null : 'img'"
  [attr.aria-label]="isDecorative() ? null : label()"
  [attr.aria-hidden]="isDecorative() ? 'true' : null"
>
  <path [attr.d]="d()" />
  @if (filledD(); as filled) {
    <path [attr.d]="filled" fill="currentColor" />
  }
</svg>
