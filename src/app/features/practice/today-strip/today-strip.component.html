@if (isShown()) {
  <nav class="today-strip" aria-label="Today">
    @for (dot of dots(); track dot.number) {
      <a
        class="today-strip__dot"
        [class.today-strip__dot--done]="dot.isDone"
        [class.today-strip__dot--current]="dot.isPage"
        [class.today-strip__dot--celebrating]="dot.isCelebrating"
        [class.today-strip__dot--landing]="dot.isLanding"
        [class.today-strip__dot--receiving]="dot.isReceiving"
        [class.today-strip__dot--finale]="dot.isFinale"
        [style.animation-delay.ms]="dot.isFinale ? dot.finaleDelayMs : null"
        [routerLink]="['/practice', dot.number]"
        [attr.aria-label]="dot.label"
        [attr.aria-current]="dot.isPage ? 'page' : null"
        [attr.title]="dot.label"
      ></a>
    }
  </nav>
}
