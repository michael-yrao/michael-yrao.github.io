<nav class="po-nav">
  <div class="po-nav__inner">
    <a class="po-nav__brand" routerLink="/" aria-label="Progressive Overflow — home">
      <app-logo-mark [size]="28" label="" />
      <span class="po-nav__wordmark">progressive<em>overflow</em></span>
    </a>

    <button
      class="po-nav__hamburger"
      [attr.aria-expanded]="isDrawerOpen()"
      [attr.aria-label]="isDrawerOpen() ? 'Close menu' : 'Open menu'"
      aria-controls="po-nav-menu"
      (click)="toggleDrawer($event)"
    >
      ☰
    </button>

    <!-- Menu drawer: two sections — primary (Progress, Practice, Library), secondary (Coach, Human) -->
    @if (isDrawerOpen()) {
      <div class="po-nav__drawer" id="po-nav-menu">
        <div class="po-nav__drawer-section">
          <a
            class="po-nav__drawer-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{
              paths: 'exact',
              queryParams: 'ignored',
              matrixParams: 'ignored',
              fragment: 'ignored',
            }"
            (click)="closeAll()"
            >Progress</a
          >
          <a
            class="po-nav__drawer-link"
            routerLink="/practice"
            routerLinkActive="active"
            (click)="closeAll()"
            >Practice</a
          >
          <a
            class="po-nav__drawer-link"
            routerLink="/library"
            routerLinkActive="active"
            (click)="closeAll()"
            >Library</a
          >
        </div>
        <div class="po-nav__drawer-section po-nav__drawer-secondary">
          <a
            class="po-nav__drawer-link po-nav__drawer-link--secondary"
            [routerLink]="SITE_LINKS.coach"
            routerLinkActive="active"
            (click)="closeAll()"
            >Coach</a
          >
          <a
            class="po-nav__drawer-link po-nav__drawer-link--secondary"
            routerLink="/about"
            routerLinkActive="active"
            (click)="closeAll()"
            >Human</a
          >
        </div>
      </div>
    }
  </div>
</nav>

<!-- Backdrop: closes the drawer on outside click -->
@if (isDrawerOpen()) {
  <div class="po-nav__backdrop" aria-hidden="true" (click)="closeAll()"></div>
}

<main class="po-main">
  <router-outlet></router-outlet>
</main>

<footer class="po-footer">
  <div class="po-footer__inner">
    <span class="po-footer__line">Built by a human, with Claude in the loop.</span>
    <span class="po-footer__copy">© {{ year }}</span>
  </div>
</footer>
