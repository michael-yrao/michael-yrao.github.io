<header class="head">
  <span class="dot" [class.dot--awake]="isAwake()" [class.dot--waking]="isWaking() && !isAwake()" [attr.aria-label]="awakeLabel()"></span>
  <span class="meter" aria-label="Session cost">{{ cost() }}</span>
  <span class="session" aria-label="Session">{{ sessionMark() }}</span>
  <span class="spacer"></span>
  @if (isStreaming()) {
    <button type="button" class="btn po-btn po-btn--ghost po-btn--sm po-btn--icon btn--stop" aria-label="Stop" (click)="stop()"><app-icon name="square" [size]="14" /></button>
  }
  <button type="button" class="btn po-btn po-btn--ghost po-btn--sm" aria-label="New session" (click)="startNewSession()"><app-icon name="reset" [size]="14" />New</button>
  <button type="button" class="btn po-btn po-btn--ghost po-btn--sm po-btn--icon" aria-label="Close coach" (click)="ui.toggle()"><app-icon name="x" [size]="14" /></button>
</header>

<div class="transcript" #scroller>
  @if (transcript().turns.length === 0) {
    <app-coach-status-card [status]="status()" [isWaking]="isWaking()" />
  } @else {
    <details class="legend">
      <summary aria-label="Legend">?</summary>
      <ul>
        <li><span class="dot dot--awake"></span>awake</li>
        <li><span class="key">$</span>session cost</li>
        <li><span class="key"><app-icon name="circle" [size]="12" /></span>running</li>
        <li><span class="key key--ok"><app-icon name="check" [size]="12" /></span>done</li>
        <li><span class="key key--bad"><app-icon name="x" [size]="12" /></span>failed</li>
        <li><span class="key"><app-icon name="square" [size]="12" /></span>stopped</li>
      </ul>
    </details>
  }
  @for (turn of transcript().turns; track $index) {
    <app-coach-message [turn]="turn" />
  }
</div>

<div class="chips">
  @for (chip of quickActions; track chip) {
    <button type="button" class="chip po-chip" [disabled]="isStreaming()" (click)="send(chip)">{{ chip }}</button>
  }
</div>

<form class="composer" (submit)="$event.preventDefault(); send(draft())">
  <textarea
    class="input po-input"
    rows="2"
    placeholder="Message"
    aria-label="Message"
    [value]="draft()"
    (input)="onDraftInput($event)"
    (keydown)="onComposerKey($event)"
  ></textarea>
  <button type="submit" class="btn btn--send po-btn po-btn--sm" aria-label="Send" [disabled]="!canSend()"><app-icon name="arrow-up" [size]="14" /></button>
</form>
