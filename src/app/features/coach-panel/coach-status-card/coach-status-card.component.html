<div class="card">
  <span class="dot dot--{{ dot() }}" [attr.aria-label]="dot()"></span>
  <code class="head">{{ headMark }}{{ head() }}</code>
  @if (isDirty()) {
    <span class="dirty" aria-label="uncommitted">●</span>
  }
  <span class="cost">{{ cost() }}</span>
</div>
<ul class="legend">
  <li><span class="dot dot--awake"></span>awake</li>
  <li><span class="dot dot--waking"></span>waking</li>
  <li><span class="dot dot--asleep"></span>asleep</li>
  <li><code>⌗</code>head</li>
  <li><span class="dirty">●</span>uncommitted</li>
  <li><span class="cost">$</span>session cost</li>
</ul>
