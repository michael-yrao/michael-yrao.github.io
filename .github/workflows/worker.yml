name: Deploy events worker

# Builds, type-checks, tests and deploys the Cloudflare Worker in worker/. Entirely separate
# from deploy.yml (the Angular site): it only runs when worker/** itself changes, and it
# deploys to Cloudflare Workers, not GitHub Pages.
#
# ONE-TIME SETUP: see worker/README.md for creating the Cloudflare account/API token and
# adding the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets this workflow needs.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
      - 'src/app/core/models/events.model.ts'
      - 'src/app/core/models/coach.model.ts'
      - 'src/app/features/interview/directory/directory-contract.ts'
      - 'scripts/check-contract-mirror.mjs'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
      - 'src/app/core/models/events.model.ts'
      - 'src/app/core/models/coach.model.ts'
      - 'src/app/features/interview/directory/directory-contract.ts'
      - 'scripts/check-contract-mirror.mjs'
  workflow_dispatch:

defaults:
  run:
    working-directory: worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            worker/coach/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Contract mirror check
        run: npm run check:contract-mirror
        working-directory: .

      - name: Unit tests
        run: npm test

      - name: Coach runtime
        working-directory: worker/coach
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Check Cloudflare secrets
        id: secrets
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; echo "::notice::Cloudflare secrets not set — typecheck/tests ran, deploy skipped (see worker/README.md)"; fi

      # With COACH_ENABLED set, the coach job below deploys the coach config instead; a base deploy
      # would drop the CoachContainer class (see worker/README.md).
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && steps.secrets.outputs.configured == 'true' && vars.COACH_ENABLED != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

  # The paid coach runtime, deployed from its own config once the checks above pass.
  coach:
    needs: deploy
    if: github.event_name != 'pull_request' && vars.COACH_ENABLED == 'true'
    uses: ./.github/workflows/coach-deploy.yml
    secrets: inherit
