<button type="button" class="lifter" aria-label="Add a plate to the barbell" (click)="onLift()">
  <svg viewBox="0 0 160 160" aria-hidden="true" focusable="false">
    <line class="ground" x1="44" y1="149" x2="116" y2="149" />
    <g class="body">
      <polyline [attr.points]="leftLeg()" />
      <polyline [attr.points]="rightLeg()" />
    </g>
    <g class="bob">
      <g class="squat" [style.transform]="squatTransform()">
        <g class="body">
          <line x1="80" y1="80" x2="80" y2="108" />
          <line x1="70" y1="85" x2="90" y2="85" />
          <polyline [attr.points]="leftArm()" />
          <polyline [attr.points]="rightArm()" />
        </g>
        <circle class="head" cx="80" cy="68" r="12" />
        <circle class="eye" cx="75" cy="66" r="2" />
        <circle class="eye" cx="85" cy="66" r="2" />
        <path class="mouth" [attr.d]="mouthPath()" />
        @if (isStraining()) {
          <path class="sweat" d="M93 54 Q96 58 93 60 Q90 58 93 54 Z" />
        }
        <path class="bar" [attr.d]="barPath()" />
        @for (plate of plates(); track plate.key) {
          <rect
            class="plate plate--{{ plate.index }}"
            [attr.x]="plate.x"
            [attr.y]="plate.y"
            [attr.width]="plateWidth"
            [attr.height]="plate.height"
            rx="1.5"
          />
        }
      </g>
      @if (state().isSpilling) {
        <g [style.transform]="spillTransform">
          <g class="spill" (animationend)="onSpillEnd()">
            @for (plate of spillPlates; track plate.key) {
              <rect
                class="spill__plate spill__plate--{{ plate.index }}"
                [attr.x]="plate.x"
                [attr.y]="plate.y"
                [attr.width]="plateWidth"
                [attr.height]="plate.height"
                rx="1.5"
              />
            }
          </g>
        </g>
      }
    </g>
  </svg>
</button>
