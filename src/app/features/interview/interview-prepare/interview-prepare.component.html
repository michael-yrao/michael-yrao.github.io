<section class="practice">
  @if (message(); as text) {
    <p class="practice__message">{{ text }}</p>
  }
  <div class="interview-prepare">
    <app-page-header [breadcrumb]="breadcrumb" heading="Interview problem" />
    <div class="practice__tabs" role="tablist">
      @for (item of tabs; track item.id) {
        <button
          type="button"
          role="tab"
          class="practice__tab"
          [class.practice__tab--active]="tab() === item.id"
          [attr.aria-selected]="tab() === item.id"
          (click)="tab.set(item.id)"
        >{{ item.label }}</button>
      }
    </div>

    <app-problem-editor class="interview-prepare__editor" [hidden]="tab() === 'view'" [problem]="form()" [isRejected]="isRejected()" [isSplit]="true" (problemChange)="onFormChange($event)">
      <button type="button" class="practice__btn practice__btn--primary" [disabled]="isRejected()" (click)="save()">Save</button>
      <span class="interview-prepare__status">{{ status() }}</span>
    </app-problem-editor>

    @if (tab() === 'view') {
      <div class="practice__split interview-prepare__split" [style.--problem-track]="problemTrack" [style.--work-track]="workTrack">
        <div class="practice__problem">
          @if (form().title; as title) {
            <h2 class="interview-prepare__title">{{ title }}</h2>
          }
          <app-practice-description [problem]="preview()" />
        </div>
        <div class="practice__work">
          <div class="practice__code-body">
            <app-code-editor [initialText]="form().starter" [extensions]="readOnlyExtensions" />
          </div>
        </div>
      </div>
    }
  </div>
</section>
