<div class="tech-tree__scroll">
  <svg
    class="tech-tree__svg"
    [attr.viewBox]="'0 0 ' + layout().width + ' ' + layout().height"
    [attr.width]="layout().width"
    [attr.height]="layout().height"
    role="group"
    [attr.aria-label]="'Technique skill tree, ' + layout().nodes.length + ' techniques'"
  >
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
        <path class="tech-tree__arrowhead" d="M0,0 L8,4 L0,8 Z" />
      </marker>
    </defs>

    @for (edge of layout().edges; track edge.from + '>' + edge.to) {
      <path
        class="tech-tree__edge"
        [class.tech-tree__edge--highlighted]="isEdgeHighlighted(edge.from, edge.to)"
        [attr.d]="edge.path"
        marker-end="url(#arrow)"
      />
    }

    @for (node of layout().nodes; track node.name) {
      @let technique = techniqueFor(node.name);
      <g
        class="tech-tree__node"
        [class.tech-tree__node--mastered]="isMastered(node.name)"
        [class.tech-tree__node--started]="technique.started && !isMastered(node.name)"
        [class.tech-tree__node--not-started]="!technique.started"
        [class.tech-tree__node--selected]="isSelected(node.name)"
        role="button"
        tabindex="0"
        [attr.aria-pressed]="isSelected(node.name)"
        [attr.aria-label]="technique.name"
        [attr.transform]="'translate(' + node.x + ',' + node.y + ')'"
        (click)="onSelect(node.name)"
        (keydown.enter)="onSelect(node.name)"
        (keydown.space)="$event.preventDefault(); onSelect(node.name)"
      >
        <rect class="tech-tree__rect" [attr.width]="NODE_W" [attr.height]="NODE_H" rx="6" />
        <text class="tech-tree__label" [attr.x]="NODE_W / 2" y="17" text-anchor="middle">{{ clampLabel(technique.name) }}</text>
        <text class="tech-tree__ratio" [attr.x]="NODE_W / 2" y="33" text-anchor="middle">{{ graduatedCountFor(node.name) }}/{{ technique.minProblems }} 🎓</text>
      </g>
    }
  </svg>
</div>

<p class="tech-tree__legend">solid = graduated ≥ threshold · dashed = not started</p>

@if (graph().droppedEdgeCount > 0) {
  <p class="tech-tree__footnote">
    {{ graph().droppedEdgeCount }} prerequisite link{{ graph().droppedEdgeCount === 1 ? '' : 's' }}
    skipped (technique not found)
  </p>
}
