<div class="controls">
  <div class="controls__nav">
    <button class="btn-ctrl po-btn po-btn--icon" (click)="goToStart()" [disabled]="atStart" title="Go to start" aria-label="First step"><app-icon name="skip-back" [size]="16" /></button>
    <button class="btn-ctrl po-btn po-btn--icon" (click)="stepBack()"  [disabled]="atStart" title="Step back (←)" aria-label="Step back"><app-icon name="step-back" [size]="16" /></button>
    <button
      class="btn-ctrl btn-ctrl--play po-btn"
      (click)="togglePlay()"
      [title]="isPlaying() ? 'Pause (Space)' : 'Play (Space)'"
      [attr.aria-label]="isPlaying() ? 'Pause' : 'Play'"
    >
      <app-icon [name]="isPlaying() ? 'pause' : 'play'" [size]="16" />
    </button>
    <button class="btn-ctrl po-btn po-btn--icon" (click)="stepForward()" [disabled]="atEnd" title="Step forward (→)" aria-label="Step forward"><app-icon name="step-forward" [size]="16" /></button>
    <button class="btn-ctrl po-btn po-btn--icon" (click)="goToEnd()"    [disabled]="atEnd" title="Go to end" aria-label="Last step"><app-icon name="skip-forward" [size]="16" /></button>
    <button class="btn-ctrl po-btn po-btn--icon" (click)="onReset()" title="Reset" aria-label="Reset"><app-icon name="reset" [size]="16" /></button>
  </div>

  <div class="controls__meta">
    <span class="controls__counter" aria-live="polite">Step {{ currentStep() + 1 }} / {{ totalSteps() }}</span>
    <span class="controls__kbd-hint" aria-hidden="true">
      <kbd>←</kbd><kbd>→</kbd> step · <kbd>Space</kbd> play
    </span>
    <label class="controls__speed">
      <span>Speed</span>
      <input
        type="range"
        min="200"
        max="2000"
        step="100"
        [value]="speed()"
        (input)="onSpeedChange($event)"
        aria-label="Playback speed in milliseconds per step"
      />
      <span>{{ speed() }}ms</span>
    </label>
  </div>
</div>
