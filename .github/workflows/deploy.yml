name: Deploy to GitHub Pages

# Builds the Angular app and publishes it to GitHub Pages on every push to the
# default branch. Replaces the old manual `angular-cli-ghpages` deploy.
#
# ONE-TIME SETUP (repo Settings -> Pages):
#   Source: "GitHub Actions"  (switch away from "Deploy from a branch")
# The custom domain (progressiveoverflow.com) is preserved automatically because
# src/CNAME is copied into the build output via angular.json `assets`.
#
# NOTE: this assumes the default branch is `main`. If it is `master`, change the
# branch below (or just use the "Run workflow" button -> workflow_dispatch).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent run per ref; newer pushes cancel in-flight runs. The ref is in
# the group so a pull request run can never cancel a main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Contract mirror check
        run: npm run check:contract-mirror

      - name: Registry check
        run: npm run check:registry

      - name: Sitemap check
        run: npm run check:sitemap

      # The content repo URL is derived from CONTENT_REPO_SLUG (src/app/core/data/site-links.ts);
      # the script exports each file's path as <NAME>_JSON through $GITHUB_ENV.
      - name: Fetch content
        run: node scripts/fetch-content.mjs

      # The committed copies are an offline fallback; tests and the build must read the owner's bytes.
      - name: Use owner cheat sheets
        run: |
          cp "$CHEAT_SHEETS_JSON" src/assets/cheat-sheets.json
          cp "$CHEAT_SHEETS_SCHEMA_JSON" src/assets/cheat-sheets.schema.json

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Groundedness check
        run: npm run check:groundedness
        env:
          # The report lands in src/assets so the build below ships it as assets/groundedness.json.
          GROUNDEDNESS_REPORT_OUT: ${{ github.workspace }}/src/assets/groundedness.json

      - name: Build (production)
        run: npm run build

      - name: E2E smoke
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/progressive-overflow

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
