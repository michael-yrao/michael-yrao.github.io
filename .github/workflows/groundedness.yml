name: Groundedness re-check

# Re-runs the groundedness gate against cse-progress's CURRENT main on a schedule, so a
# rename/delete of a manifest-selected symbol over there is caught even with no site push.
#
# NOTE: GitHub disables a scheduled workflow after 60 days with no repository activity.
# A manual "Run workflow" (workflow_dispatch) re-arms the schedule.

on:
  schedule:
    - cron: '17 6 * * *'
  repository_dispatch:
    types: [cse-progress-updated]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The content repo URL is derived from CONTENT_REPO_SLUG (src/app/core/data/site-links.ts);
      # the script exports each file's path as <NAME>_JSON through $GITHUB_ENV.
      - name: Fetch content
        run: node scripts/fetch-content.mjs

      - name: Groundedness check
        run: npm run check:groundedness
