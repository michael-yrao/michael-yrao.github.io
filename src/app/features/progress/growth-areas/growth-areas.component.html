<div class="growth-toggle" role="group" aria-label="Growth area">
  @for (area of areas; track area.id) {
    <button
      type="button"
      class="growth-toggle__btn"
      [class.growth-toggle__btn--active]="selected() === area.id"
      [attr.aria-pressed]="selected() === area.id"
      (click)="onSelect(area.id)"
    >{{ area.buttonLabel }}</button>
  }
</div>
