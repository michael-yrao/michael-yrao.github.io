<div class="pie">
  <svg
    class="pie__svg"
    [attr.viewBox]="viewBox"
    role="img"
    [attr.aria-label]="ariaLabel()"
  >
    @for (slice of slices(); track slice.segment.key) {
      @if (slice.isFull) {
        <circle
          class="pie__slice {{ slice.segment.cls }}"
          [class.pie__slice--clickable]="clickable()"
          cx="0"
          cy="0"
          [attr.r]="radius"
          [attr.stroke-width]="sliceGap"
          [attr.role]="clickable() ? 'button' : null"
          [attr.tabindex]="clickable() ? 0 : null"
          (click)="onSliceClick(slice.segment)"
          (keydown.enter)="onSliceKey($event, slice.segment)"
          (keydown.space)="onSliceKey($event, slice.segment)"
        >
          <title>{{ slice.segment.label }}: {{ slice.segment.value }}</title>
        </circle>
      } @else {
        <path
          class="pie__slice {{ slice.segment.cls }}"
          [class.pie__slice--clickable]="clickable()"
          [attr.d]="slice.d"
          [attr.stroke-width]="sliceGap"
          [attr.role]="clickable() ? 'button' : null"
          [attr.tabindex]="clickable() ? 0 : null"
          (click)="onSliceClick(slice.segment)"
          (keydown.enter)="onSliceKey($event, slice.segment)"
          (keydown.space)="onSliceKey($event, slice.segment)"
        >
          <title>{{ slice.segment.label }}: {{ slice.segment.value }}</title>
        </path>
      }
    }
  </svg>
  <ul class="pie__legend">
    @for (slice of slices(); track slice.segment.key) {
      <li>
        @if (clickable()) {
          <button type="button" class="pie__legend-btn" (click)="onSegmentClick(slice.segment)">
            <span class="pie__swatch {{ slice.segment.cls }}"></span>{{ slice.segment.label }} · {{ slice.segment.value }}
          </button>
        } @else {
          <span class="pie__swatch {{ slice.segment.cls }}"></span>{{ slice.segment.label }} · {{ slice.segment.value }}
        }
      </li>
    }
  </ul>
</div>
